<!DOCTYPE html>
<html>
<head>
    <title>Result</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

{% if result == "TAMPERED" %}
    <div class="badge error">❌ Tampered Certificate</div>

{% elif result == "REVOKED" %}
    <div class="badge warning">⚠ Certificate Revoked</div>

{% elif result %}
    <div class="badge success">✅ Certificate Verified</div>
    <p><b>Name:</b> {{ result[1] }}</p>
    <p><b>Competition:</b> {{ result[2] }}</p>
    <a href="/certificate/{{ result[0] }}" class="link">View Certificate</a>

{% else %}
    <div class="badge error">❌ Fake Certificate</div>
{% endif %}

<a href="/" class="link">← Verify Another</a>

</div>

</body>
</html>
